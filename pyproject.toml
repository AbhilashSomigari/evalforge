[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalforge-agents"
version = "0.1.0"
description = "CI/CD evaluation infrastructure for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "EvalForge Contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "rich>=13,<15",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<1", "ruff>=0.16.10,<0.17", "httpx2>=2,<3", "mypy>=1.11,<2", "types-PyYAML>=6,<7"]
postgres = ["psycopg[binary,pool]>=3.1,<4"]

[project.urls]
Homepage = "https://github.com/AbhilashSomigari/evalforge"
Repository = "https://github.com/AbhilashSomigari/evalforge"
Issues = "https://github.com/AbhilashSomigari/evalforge/issues"

[project.scripts]
evalforge = "evalforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# TRY004 wants TypeError for isinstance checks, but every one here validates
# parsed file content (a suite YAML or run JSON that isn't an object) - bad
# input data, not a programming error - and callers like
# storage.try_load_run deliberately catch ValueError for exactly that.
ignore = ["TRY004"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# psycopg (+ psycopg_pool) is an optional extra (the "postgres" group); mypy
# runs in CI without it installed, so its import must not be treated as a
# missing-stub error.
module = ["psycopg.*", "psycopg_pool.*"]
ignore_missing_imports = true
